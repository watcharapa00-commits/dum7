<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#070908">
  <title>DUM7 ระบบสารสนเทศเพื่อนสนิท</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070908'/%3E%3Ctext x='32' y='47' font-size='40' font-family='monospace' font-weight='700' text-anchor='middle' fill='%23ff5147'%3E7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="is-locked">

  <!-- ตัวกรองให้ตราประทับดูเหมือนหมึกยางจริง -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </svg>

  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="crt" aria-hidden="true"></div>

  <!-- ด่านตรวจ -->
  <main id="gate" class="gate">
    <div class="gate__inner">
      <svg class="seal" viewBox="0 0 200 200" aria-hidden="true">
        <defs><path id="ring" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
        <g class="seal__spin">
          <circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 4"/>
          <text font-size="14" fill="currentColor"><textPath href="#ring" textLength="486" lengthAdjust="spacing">สำนักงานทะเบียนเพื่อนนอกระบบ ★ ลับที่สุด ★ ห้ามเผยแพร่ ★</textPath></text>
        </g>
        <text x="100" y="124" text-anchor="middle" font-size="76" font-weight="700" fill="currentColor" font-family="Mitr, sans-serif">7</text>
      </svg>

      <h1 class="gate__title glitch" data-text="DUM7">DUM7</h1>
      <p class="gate__sub">ระบบสารสนเทศเพื่อนสนิท · เฉพาะผู้ได้รับอนุญาต</p>

      <pre id="boot" class="boot" aria-hidden="true"></pre>

      <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
        <label id="pw-label" for="pw">รหัสผ่านเข้าระบบ</label>
        <div class="field">
          <span class="field__prompt" aria-hidden="true">&gt;</span>
          <input id="pw" name="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="พิมพ์รหัสลับที่นี่" required>
          <button type="button" id="peek" class="field__peek" aria-pressed="false">แสดง</button>
        </div>
        <button id="submit" class="btn" type="submit">ยื่นคำร้องขอเข้าระบบ</button>
        <p id="gate-msg" class="gate__msg" role="alert"></p>
      </form>

      <p class="gate__fine">เอกสารนี้เป็นความลับ ห้ามถ่ายเอกสาร ห้ามสแกน ห้ามบอกแม่</p>
    </div>
    <div id="stamp-layer" class="stamp-layer" aria-hidden="true"></div>
  </main>

  <!-- ตัวเว็บ (แสดงหลังถอดรหัสสำเร็จ) -->
  <div id="app" class="app" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">ต้องเปิด JavaScript ถึงจะเข้าระบบได้</p></noscript>
  <script src="assets/vault.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/forms.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/calendar.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
